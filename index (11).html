<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Football FPS</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#132b38;font-family:system-ui;touch-action:none}canvas{width:100%;height:100%;display:block;touch-action:none}#score{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#0009;color:white;padding:9px 20px;border-radius:12px;font-weight:bold;font-size:22px;pointer-events:none}#hint{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:#0008;color:white;padding:6px 10px;border-radius:10px;font-size:12px;white-space:nowrap;pointer-events:none}#joy{position:fixed;left:20px;bottom:20px;width:128px;height:128px;border:2px solid #ffffff70;border-radius:50%;background:#ffffff20;touch-action:none}#nub{position:absolute;left:40px;top:40px;width:46px;height:46px;border-radius:50%;background:#ffffffa0}#buttons{position:fixed;right:12px;bottom:22px;display:flex;gap:9px}button{width:72px;height:72px;border-radius:50%;border:2px solid #ffffff90;color:white;font-weight:bold;background:#23864c;touch-action:none}#pass{background:#267cae}#shoot{background:#d64b2e;width:82px;height:82px}
</style></head><body><canvas id="c"></canvas><div id="score">0 — 0</div><div id="hint">Drag to look • Joystick to move • Get close to the ball</div><div id="joy"><div id="nub"></div></div><div id="buttons"><button id="dribble">DRIBBLE</button><button id="pass">PASS</button><button id="shoot">SHOOT</button></div>
<script src="https://cdn.babylonjs.com/babylon.js"></script><script>
(()=>{const canvas=document.getElementById('c'),engine=new BABYLON.Engine(canvas,true),scene=new BABYLON.Scene(engine);scene.clearColor=new BABYLON.Color4(.5,.75,.92,1);const camera=new BABYLON.FreeCamera('fps',new BABYLON.Vector3(0,1.65,-8),scene);camera.minZ=.1;camera.inputs.clear();
new BABYLON.HemisphericLight('light',new BABYLON.Vector3(0,1,0),scene).intensity=1;const sun=new BABYLON.DirectionalLight('sun',new BABYLON.Vector3(-.5,-1,.4),scene);sun.intensity=.4;
function material(n,c){let m=new BABYLON.StandardMaterial(n,scene);m.diffuseColor=BABYLON.Color3.FromHexString(c);return m}const green=material('green','#287943'),green2=material('green2','#31864b'),white=material('white','#f5f5f5'),seats=material('seats','#526d87'),net=material('net','#d1e3e9'),ballwhite=material('ballwhite','#f8f8f8'),black=material('black','#222222');
function box(n,x,y,z,w,h,d,m){let o=BABYLON.MeshBuilder.CreateBox(n,{width:w,height:h,depth:d},scene);o.position.set(x,y,z);o.material=m;return o}box('field',0,-.11,0,50,.2,82,green);for(let i=0;i<8;i++)box('stripe',0,.001,-35+i*10,50,.01,10,i%2?green:green2);
function line(x,z,w,d){box('mark',x,.015,z,w,.025,d,white)}line(0,-40,50,.12);line(0,40,50,.12);line(-25,0,.12,80);line(25,0,.12,80);line(0,0,50,.12);let ring=BABYLON.MeshBuilder.CreateTorus('centerCircle',{diameter:18,thickness:.12},scene);ring.rotation.x=Math.PI/2;ring.position.y=.035;ring.material=white;
function goal(z){let s=Math.sign(z)||1;const h=2.4,w=7.32,d=3.8;box('postL',-w/2,h/2,z,.14,h,.14,white);box('postR',w/2,h/2,z,.14,h,.14,white);box('bar',0,h,z,w,.14,.14,white);box('netBack',0,h/2,z+s*d,w,h,.08,net);box('netRoof',0,h,z+s*d/2,w,.08,d,net);box('netSideL',-w/2,h/2,z+s*d/2,.08,h,d,net);box('netSideR',w/2,h/2,z+s*d/2,.08,h,d,net)}goal(39);goal(-39);
// tiered stands
for(let t=0;t<4;t++){let y=1.6+t*2.5;box('standN',0,y,46+t*2,60,2,5,t%2?seats:green2);box('standS',0,y,-46-t*2,60,2,5,t%2?green2:seats);box('standE',30+t*2,y,0,5,2,88,t%2?seats:green2);box('standW',-30-t*2,y,0,5,2,88,t%2?green2:seats)}
// ball sphere and surface spots
const ball=BABYLON.MeshBuilder.CreateSphere('ball',{diameter:.48,segments:32},scene);ball.material=ballwhite;ball.position.set(0,.24,2);const spots=[];for(let i=0;i<5;i++){let p=BABYLON.MeshBuilder.CreateSphere('spot',{diameter:.12,segments:8},scene);p.material=black;spots.push(p)}
let yaw=0,pitch=0,held=false,vel=new BABYLON.Vector3(),jx=0,jy=0,scoreA=0,scoreB=0;const forward=()=>new BABYLON.Vector3(Math.sin(yaw),0,Math.cos(yaw));function positionBall(){let f=forward();ball.position.copyFrom(camera.position.add(f.scale(1.15)));ball.position.y=.24;vel.set(0,0,0)}function acquire(){if(!held&&BABYLON.Vector3.Distance(camera.position,ball.position)<1.55&&ball.position.y<1.2){held=true;positionBall()}}function kick(power){if(!held)return;held=false;let f=forward();f.y=Math.max(-.1,Math.min(.45,pitch*.55));f.normalize();vel=f.scale(power);vel.y+=power*.12}
scene.onBeforeRenderObservable.add(()=>{let dt=Math.min(engine.getDeltaTime()/1000,.04);camera.position.x+=forward().x*jy*dt*6+Math.cos(yaw)*jx*dt*5;camera.position.z+=forward().z*jy*dt*6-Math.sin(yaw)*jx*dt*5;camera.position.x=Math.max(-23,Math.min(23,camera.position.x));camera.position.z=Math.max(-38,Math.min(38,camera.position.z));camera.position.y=1.65;camera.rotation.set(pitch,yaw,0);if(held)positionBall();else{ball.position.addInPlace(vel.scale(dt));vel.y-=9.8*dt;if(ball.position.y<.24){ball.position.y=.24;vel.y=Math.max(0,-vel.y*.3);if(vel.y<.3)vel.y=0}vel.scaleInPlace(Math.pow(.985,dt*60));acquire()}spots.forEach((p,i)=>{let a=i*6.28/5;p.position=ball.position.add(new BABYLON.Vector3(Math.cos(a)*.17,.05*Math.sin(a),Math.sin(a)*.17))});if(Math.abs(ball.position.z)>39&&Math.abs(ball.position.x)<3.7&&ball.position.y<2.5){if(ball.position.z>0)scoreA++;else scoreB++;document.getElementById('score').textContent=scoreA+' — '+scoreB;ball.position.set(0,.24,0);vel.set(0,0,0);held=false}});
// drag camera
let drag=false,px=0,py=0;canvas.addEventListener('pointerdown',e=>{if(e.clientY>innerHeight-175)return;drag=true;px=e.clientX;py=e.clientY;canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!drag)return;let dx=e.clientX-px,dy=e.clientY-py;px=e.clientX;py=e.clientY;yaw+=dx*.006;pitch=Math.max(-.75,Math.min(.75,pitch-dy*.005));});canvas.addEventListener('pointerup',()=>drag=false);canvas.addEventListener('pointercancel',()=>drag=false);
// joystick
document.getElementById('joy').addEventListener('pointerdown',e=>{e.currentTarget.setPointerCapture(e.pointerId);joyActive=true;joyMove(e)});let joyActive=false;document.getElementById('joy').addEventListener('pointermove',e=>{if(joyActive)joyMove(e)});document.getElementById('joy').addEventListener('pointerup',()=>{joyActive=false;jx=jy=0;document.getElementById('nub').style.transform='translate(0,0)'});function joyMove(e){let r=document.getElementById('joy').getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,max=40,len=Math.hypot(dx,dy);if(len>max){dx*=max/len;dy*=max/len} jx=dx/max;jy=-dy/max;document.getElementById('nub').style.transform=`translate(${dx}px,${dy}px)`}
document.getElementById('dribble').onclick=()=>{if(!held)acquire();else{held=false;vel.set(0,0,0)}};document.getElementById('pass').onclick=()=>kick(8);document.getElementById('shoot').onclick=()=>kick(16);
window.addEventListener('keydown',e=>{if(['w','ArrowUp'].includes(e.key))jy=1;if(['s','ArrowDown'].includes(e.key))jy=-1;if(['a','ArrowLeft'].includes(e.key))jx=-1;if(['d','ArrowRight'].includes(e.key))jx=1;if(e.key===' ')kick(16)});window.addEventListener('keyup',e=>{if(['w','s','ArrowUp','ArrowDown'].includes(e.key))jy=0;if(['a','d','ArrowLeft','ArrowRight'].includes(e.key))jx=0});engine.runRenderLoop(()=>scene.render());window.addEventListener('resize',()=>engine.resize());})();
</script></body></html>
